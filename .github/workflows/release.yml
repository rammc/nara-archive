name: release

# Manual-only until PyPI Trusted Publishing is configured on
# https://pypi.org/manage/account/publishing/. Auto-trigger on every
# ``v*`` tag was creating one failing "pypi" deployment per RC tag —
# see the Deployments tab. Re-enable the tag trigger only after the
# very first manual ``workflow_dispatch`` run lands a green release.
#
# Final-release tags (``v0.4.0``, ``v1.0.0``) will be filtered through
# the explicit pattern below so RC tags (``v0.9.0-rc7``) can never
# trip this workflow.
on:
  workflow_dispatch:
  # Disabled until first successful PyPI publish via workflow_dispatch:
  # push:
  #   tags:
  #     - "v[0-9]+.[0-9]+.[0-9]+"   # excludes -rc, -beta, -alpha

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing — configure the project at
    # https://pypi.org/manage/account/publishing/ to allow this workflow.
    # No API tokens needed; OIDC handles authentication.
    environment:
      name: pypi
      url: https://pypi.org/p/nara-archive
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
