[project]
name = "nara-archive"
version = "0.1.0"
description = "Bulk download NARA Catalog digital objects and assemble one PDF per File Unit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "typer[all]>=0.12",
    "tqdm>=4.66",
    "img2pdf>=0.5",
    "pypdf>=4.2",
    "Pillow>=10.3",
    "python-slugify>=8.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
nara = "nara.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nara"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
