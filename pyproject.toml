[project]
name = "nara-archive"  # TODO before PyPI publish: confirm availability; fallback `naracat`
version = "0.3.0"
description = "Bulk-download NARA Catalog digital objects and assemble one PDF per File Unit; ships with a local web UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Ramm" },
]
keywords = ["nara", "archives", "genealogy", "research", "historical-records"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Sociology :: History",
]

dependencies = [
    "requests>=2.32",
    "typer[all]>=0.12",
    "tqdm>=4.66",
    "img2pdf>=0.5",
    "pypdf>=4.2",
    "Pillow>=10.3",
    "python-slugify>=8.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    # macOS-only: menubar wrapper for the bundled .app + Keychain default.
    # PyPI installs on Linux/Windows skip these via the platform marker.
    "rumps>=0.4 ; sys_platform == 'darwin'",
    "keyring>=24.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
keyring = [
    "keyring>=24.0",
]
ocr = [
    # Adds an OCR layer to assembled PDFs. Requires the Tesseract binary to
    # be installed externally (brew install tesseract / apt install tesseract-ocr).
    "ocrmypdf>=15.0",
]
mac = [
    # Already pulled in by the platform-marker dependencies above when running
    # on macOS — this extra exists so `pip install 'nara-archive[mac]'` is a
    # discoverable noun for the install docs.
    "rumps>=0.4 ; sys_platform == 'darwin'",
    "keyring>=24.0 ; sys_platform == 'darwin'",
    "pyinstaller>=6.0 ; sys_platform == 'darwin'",
]

[project.scripts]
nara = "nara.cli:app"
# Used only by the PyInstaller-bundled macOS .app. Safe to invoke directly from
# a venv on a Mac for development (`python -m nara.macapp.main`).
nara-archive-app = "nara.macapp.main:main"

[project.urls]
Homepage = "https://github.com/rammc/nara-archive"
Repository = "https://github.com/rammc/nara-archive"
Issues = "https://github.com/rammc/nara-archive/issues"
Changelog = "https://github.com/rammc/nara-archive/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nara"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
